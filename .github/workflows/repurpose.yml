name: Motivational Video Cloud Repurposer

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL to repurpose'
        required: true
        type: string
      speaker_name:
        description: 'Speaker Name (leave blank for Groq AI auto-detect)'
        required: false
        default: ''
        type: string
      speaker_image:
        description: 'Speaker Photo / Avatar (Image URL or base64 data)'
        required: false
        default: ''
        type: string
      aspect:
        description: 'Aspect Ratio: landscape (16:9) or portrait (9:16 Shorts)'
        required: false
        default: 'landscape'
        type: choice
        options:
          - landscape
          - portrait
      duration:
        description: 'Clip Duration in seconds (e.g. 180 for 3m, 300 for 5m, or 0 for full audio)'
        required: false
        default: '180'
        type: string
      audio_only:
        description: 'Test mode: Audio extraction & transcription only'
        required: false
        default: false
        type: boolean
      upload:
        description: 'Upload finished video to YouTube'
        required: false
        default: false
        type: boolean
      privacy:
        description: 'YouTube upload privacy'
        required: false
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public
      dry_run:
        description: 'Dry run test (no rendering/upload)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  repurpose-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js for yt-dlp challenge solving
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Deno for yt-dlp EJS solver
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp

      - name: Prepare YouTube Cookies (Optional)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "✅ Loaded YouTube authentication cookies"
          fi

      - name: Run Motivational Repurposing Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CI: 'true'
        run: |
          CMD="python pipeline.py --url \"${{ github.event.inputs.youtube_url }}\""
          
          if [ -n "${{ github.event.inputs.speaker_name }}" ]; then
            CMD="$CMD --speaker-name \"${{ github.event.inputs.speaker_name }}\""
          fi
          
          if [ -n "${{ github.event.inputs.speaker_image }}" ]; then
            CMD="$CMD --speaker-image \"${{ github.event.inputs.speaker_image }}\""
          fi
          
          ASPECT="${{ github.event.inputs.aspect || 'landscape' }}"
          CMD="$CMD --aspect $ASPECT"
          
          DURATION="${{ github.event.inputs.duration }}"
          if [ -n "$DURATION" ] && [ "$DURATION" != "0" ] && [ "$DURATION" != "full" ]; then
            CMD="$CMD --duration $DURATION"
          fi
          
          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            CMD="$CMD --audio-only"
          fi
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          
          if [ "${{ github.event.inputs.upload }}" = "true" ] && [ -n "${{ secrets.YOUTUBE_REFRESH_TOKEN }}" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ] && [ "${{ github.event.inputs.audio_only }}" != "true" ]; then
            PRIVACY="${{ github.event.inputs.privacy || 'private' }}"
            CMD="$CMD --upload --privacy $PRIVACY"
          fi
          
          echo "🚀 Running Cloud Pipeline: $CMD"
          eval "$CMD"

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motivational-repurposed-output
          path: output/
          retention-days: 14
