name: Motivational Video Cloud Repurposer

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL to repurpose'
        required: true
        type: string
      speaker_name:
        description: 'Speaker Name (leave blank for Groq AI auto-detect)'
        required: false
        default: ''
        type: string
      aspect:
        description: 'Aspect Ratio: landscape (16:9) or portrait (9:16 Shorts)'
        required: false
        default: 'landscape'
        type: choice
        options:
          - landscape
          - portrait
      audio_only:
        description: 'Test mode: Audio extraction & transcription only'
        required: false
        default: false
        type: boolean
      upload:
        description: 'Upload finished video to YouTube'
        required: false
        default: true
        type: boolean
      privacy:
        description: 'YouTube upload privacy'
        required: false
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public
      dry_run:
        description: 'Dry run test (no rendering/upload)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  repurpose-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Motivational Repurposing Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CI: 'true'
        run: |
          CMD="python pipeline.py --url \"${{ github.event.inputs.youtube_url }}\""
          
          if [ -n "${{ github.event.inputs.speaker_name }}" ]; then
            CMD="$CMD --speaker-name \"${{ github.event.inputs.speaker_name }}\""
          fi
          
          ASPECT="${{ github.event.inputs.aspect || 'landscape' }}"
          CMD="$CMD --aspect $ASPECT"
          
          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            CMD="$CMD --audio-only"
          fi
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          
          if [ "${{ github.event.inputs.upload }}" = "true" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ] && [ "${{ github.event.inputs.audio_only }}" != "true" ]; then
            PRIVACY="${{ github.event.inputs.privacy || 'private' }}"
            CMD="$CMD --upload --privacy $PRIVACY"
          fi
          
          echo "🚀 Running Cloud Pipeline: $CMD"
          eval "$CMD"

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motivational-repurposed-output
          path: output/
          retention-days: 14
